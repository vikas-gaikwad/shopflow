
spring.application.name=shopflow-api
server.port=8080

spring.datasource.url=${SHOPFLOW_DB_URL:jdbc:postgresql://localhost:5432/shopflow}
spring.datasource.username=${SHOPFLOW_DB_USERNAME:postgres}
spring.datasource.password=${SHOPFLOW_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
